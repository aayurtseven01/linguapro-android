name: Import approved mascot splash

on:
  push:
    branches:
      - codex/brand-avatar-polish
    paths:
      - .github/workflows/import-approved-splash.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/brand-avatar-polish
      - name: Download approved mascot splash
        run: |
          curl --fail --location --retry 3             'https://d2ol7oe51mr4n9.cloudfront.net/user_3KCsf9vQO84Ur4MDs7hWZGibTsJ/3ad48ee4-a2a1-4116-8e5a-f77eacf98ffb.mp4'             --output app/src/main/res/raw/splash_logo.mp4
          test "$(stat -c%s app/src/main/res/raw/splash_logo.mp4)" -gt 1900000
      - name: Commit approved splash and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-approved-splash.yml
          git add app/src/main/res/raw/splash_logo.mp4 .github/workflows/import-approved-splash.yml
          git commit -m "Use approved full-size owl splash animation"
          git push
