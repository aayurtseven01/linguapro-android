name: Android build and quality checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run unit tests and build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/catalog/
      - name: Upload installable preview and release bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
      - name: Publish debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "LinguaPro debug build #${{ github.run_number }}"
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Firestore security rules in emulator
        run: |
          npm ci --prefix tests/firestore-rules
          npm test --prefix tests/firestore-rules

  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free hosted-runner space for emulator userdata
        run: |
          # API 24 images can require a larger minimum partition than disk-size.
          # This Java/Kotlin app does not build .NET or native NDK code.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /home/runner /usr/local/lib/android/sdk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # Keep the emulator data partition within hosted-runner disk capacity.
          disk-size: 2048M
          disable-animations: true
          script: |
            chmod +x gradlew && ./gradlew -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest
            mkdir -p app/build/ui-screenshots
            if [ "${{ matrix.api-level }}" -ge 26 ]; then for name in study-plan-top study-plan-bottom delete-confirmation pro-preview writing-task; do adb shell run-as com.linguapro.android cat files/qa-screenshots/$name.png > app/build/ui-screenshots/$name.png; done; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/ui-screenshots/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts
      - run: npm test --prefix functions && npm run check --prefix functions
