name: Android build and quality checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run unit tests and build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Publish debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "LinguaPro debug build #${{ github.run_number }}"
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Firestore security rules in emulator
        run: |
          npm ci --prefix tests/firestore-rules
          npm test --prefix tests/firestore-rules
