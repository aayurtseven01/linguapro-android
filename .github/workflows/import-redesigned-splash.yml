name: Import redesigned splash asset

on:
  push:
    branches:
      - codex/brand-avatar-polish
    paths:
      - .github/workflows/import-redesigned-splash.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/brand-avatar-polish
      - name: Download verified splash video
        run: |
          curl --fail --location --retry 3             'https://d2ol7oe51mr4n9.cloudfront.net/user_3KCsf9vQO84Ur4MDs7hWZGibTsJ/c091622e-15f0-4df5-a6c0-a3a6ae42a0b7.mp4'             --output app/src/main/res/raw/splash_logo.mp4
          test "$(stat -c%s app/src/main/res/raw/splash_logo.mp4)" -gt 90000
      - name: Commit splash asset and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-redesigned-splash.yml
          git add app/src/main/res/raw/splash_logo.mp4 .github/workflows/import-redesigned-splash.yml
          git commit -m "Replace splash video with redesigned brand animation"
          git push
