name: Import owl splash asset

on:
  push:
    branches:
      - codex/brand-avatar-polish
    paths:
      - .github/workflows/import-owl-splash.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/brand-avatar-polish
      - name: Download verified owl splash
        run: |
          curl --fail --location --retry 3             'https://d2ol7oe51mr4n9.cloudfront.net/user_3KCsf9vQO84Ur4MDs7hWZGibTsJ/645d41f7-3667-4fac-ad27-ea4524fb2f05.mp4'             --output app/src/main/res/raw/splash_logo.mp4
          test "$(stat -c%s app/src/main/res/raw/splash_logo.mp4)" -gt 170000
      - name: Commit owl splash and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-owl-splash.yml
          git add app/src/main/res/raw/splash_logo.mp4 .github/workflows/import-owl-splash.yml
          git commit -m "Restore owl mascot in redesigned splash"
          git push
